services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym_ai_api
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - SECRET_KEY=clave_secreta_produccion_gym_ai_super_segura_12345
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - gym_ai_network

networks:
  gym_ai_network:
    driver: bridge
